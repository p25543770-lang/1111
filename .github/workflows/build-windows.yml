name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview pythonnet

      - name: Chromium для Playwright (внутри сборки)
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium

      - name: Сборка exe
        run: pyinstaller --noconfirm --clean autovvod.spec

      - name: Проверка собранного приложения
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          if (Test-Path $out) { Remove-Item $out -Force }
          $p = Start-Process -FilePath ".\dist\AutoVvod\AutoVvod.exe" `
            -ArgumentList @("--selftest", $out) -Wait -PassThru
          $code = $p.ExitCode
          $ok = ($code -eq 0)
          if (Test-Path $out) {
            $json = Get-Content $out -Raw
            Write-Host $json
            $parsed = $json | ConvertFrom-Json
            if (-not $parsed.ok) { $ok = $false }
          } else {
            Write-Host "Отчёт самопроверки не создан"
            $ok = $false
          }
          if (-not $ok) {
            Write-Error "Автопроверка сборки не прошла (код $code)"
            exit 1
          }

      - name: Диагностика
        if: always()
        shell: pwsh
        run: |
          function Note($title, $text) {
            $t = $text -replace "%","%25" -replace "`r","%0D" -replace "`n","%0A"
            Write-Host "::notice title=$title::$t"
          }

          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          if (Test-Path $out) {
            Note "selftest" (Get-Content $out -Raw)
          } else {
            Note "selftest" "файл отчёта не создан"
          }

          if (Test-Path ".\dist\AutoVvod\AutoVvod.exe") {
            Note "files" ((Get-ChildItem ".\dist\AutoVvod" -Recurse -File | Measure-Object -Property Length -Sum).Sum)
          } else {
            Note "files" "exe не найден"
          }
          $browsers = Get-ChildItem ".\dist\AutoVvod" -Recurse -Directory -Filter ".local-browsers" -ErrorAction SilentlyContinue
          Note "browsers" ("local-browsers: " + ($browsers | Measure-Object).Count)

      - name: Упаковка
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AutoVvod/* -DestinationPath AutoVvod-windows-x64.zip -CompressionLevel Optimal
          Get-Item AutoVvod-windows-x64.zip | Select-Object Name, Length

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: AutoVvod-windows-x64
          path: AutoVvod-windows-x64.zip
          retention-days: 30

      - name: Релиз (только для тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoVvod-windows-x64.zip
          name: АвтоВвод ${{ github.ref_name }}
          body: |
            **Windows 10/11 x64.** Распакуйте архив и запустите `AutoVvod.exe`.

            Chromium для автоматизации уже внутри сборки — ничего дополнительно
            устанавливать не нужно. Настройки и снимки экрана хранятся в
            `%LOCALAPPDATA%\AutoVvod`.
