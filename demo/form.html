<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Демо-форма заявки</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;background:#f6f7fb;margin:0;padding:40px}
  .wrap{max-width:460px;margin:0 auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(20,30,60,.08)}
  h1{font-size:20px;margin:0 0 6px}p.sub{color:#667;margin:0 0 20px;font-size:13px}
  label{display:block;font-size:13px;color:#445;margin:14px 0 6px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d5dbe6;border-radius:9px;font:inherit;box-sizing:border-box}
  button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:10px;background:#2f6fed;color:#fff;font:600 15px system-ui;cursor:pointer}
  .result{margin-top:16px;padding:12px;border-radius:10px;background:#eaf7ee;color:#1c6b3a;font-size:13px;display:none}
  .row2{display:flex;gap:12px}.row2>div{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Заявка на подключение</h1>
  <p class="sub">Демо-страница для проверки автоматизации</p>
  <form id="f" onsubmit="event.preventDefault();document.getElementById('res').style.display='block';document.getElementById('res').textContent='Отправлено: '+document.getElementById('name').value+' / '+document.getElementById('phone').value;">
    <label for="name">Имя</label>
    <input id="name" name="name" placeholder="Ваше имя">
    <div class="row2">
      <div>
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" type="tel" placeholder="+7 999 000-00-00">
      </div>
      <div>
        <label for="city">Город</label>
        <select id="city" name="city">
          <option value="Москва">Москва</option>
          <option value="Казань">Казань</option>
          <option value="Новосибирск">Новосибирск</option>
        </select>
      </div>
    </div>
    <label for="comment">Комментарий</label>
    <textarea id="comment" name="comment" rows="2" placeholder="Дополнительно"></textarea>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px">
      <input type="checkbox" id="agree" name="agree" style="width:auto"> согласен на обработку данных
    </label>
    <button type="submit" id="send">Отправить заявку</button>
  </form>
  <div class="result" id="res"></div>
</div>
</body>
</html>
